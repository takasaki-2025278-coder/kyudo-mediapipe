<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>
    body { margin: 0; overflow: hidden; background-color: #000; color: white; font-family: sans-serif; }
    #container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
    video, canvas { position: absolute; width: 100%; height: 100%; object-fit: cover; }
    canvas { z-index: 10; }
    #status-bar { position: absolute; top: 20px; left: 20px; z-index: 20; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 8px; }
  </style>
  
  <!-- ご自身のGitHub PagesのURL（完璧です！） -->
  <script src="https://takasaki-2025278-coder.github.io/kyudo-mediapipe/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://takasaki-2025278-coder.github.io/kyudo-mediapipe/control_utils.js" crossorigin="anonymous"></script>
  <script src="https://takasaki-2025278-coder.github.io/kyudo-mediapipe/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://takasaki-2025278-coder.github.io/kyudo-mediapipe/pose.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="container">
    <video class="input_video" autoplay playsinline></video>
    <canvas class="output_canvas"></canvas>
    <div id="status-bar">AIモデル読み込み中...</div>
  </div>

  <script>
    const videoElement = document.querySelector('.input_video');
    const canvasElement = document.querySelector('.output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const statusBar = document.getElementById('status-bar');

    // ==========================================
    // 1. MediaPipe Pose の設定
    // ==========================================
    const pose = new Pose({locateFile: (file) => {
      return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;
    }});

    pose.setOptions({
      modelComplexity: 0,
      smoothLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    pose.onResults(onResults);

    function onResults(results) {
      statusBar.innerText = "認識中...";
      
      canvasElement.width = videoElement.videoWidth;
      canvasElement.height = videoElement.videoHeight;
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      if (results.poseLandmarks) {
        // 右手首(16)
        const rightWrist = results.poseLandmarks[16];
        
        canvasCtx.fillStyle = "red";
        canvasCtx.beginPath();
        canvasCtx.arc(rightWrist.x * canvasElement.width, rightWrist.y * canvasElement.height, 8, 0, 2 * Math.PI);
        canvasCtx.fill();
      } else {
        statusBar.innerText = "人が映っていません";
      }
    }

    // ==========================================
    // 2. カメラ起動とループ処理
    // ==========================================
    let lastVideoTime = -1;

    async function startCamera() {
      statusBar.innerText = "カメラの許可を待っています...";
      const constraints = {
        video: { 
          facingMode: 'environment',
          width: { ideal: 640 },
          height: { ideal: 480 }
        }
      };
      
      try {
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        videoElement.srcObject = stream;
        videoElement.addEventListener("loadeddata", predictWebcam);
      } catch (err) {
        statusBar.innerText = "カメラの起動に失敗しました。";
        console.error(err);
      }
    }

    async function predictWebcam() {
      if (lastVideoTime !== videoElement.currentTime) {
        lastVideoTime = videoElement.currentTime;
        await pose.send({image: videoElement});
      }
      window.requestAnimationFrame(predictWebcam);
    }

    startCamera();
  </script>
</body>
</html>
